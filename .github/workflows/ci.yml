name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run cf:types:check
      - run: npm run typecheck
      - run: npm test
      - run: node --import tsx --test tests/config.test.ts
      - run: npm run build
      - run: npx wrangler deploy --dry-run --env=""
      - run: npx wrangler deploy --dry-run --env staging
